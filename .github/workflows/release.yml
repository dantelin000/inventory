# main 上 package.json 的 version 变了就自动打 tag 并发布 GitHub Release，
# 说明文字取 README「更新记录」里对应的 ### vX.Y.Z 段落。
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish release for package.json version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "$VERSION already released"
            exit 0
          fi
          awk -v v="### $VERSION" '
            index($0, v) == 1 { on = 1; next }
            on && (/^### / || /^## /) { exit }
            on { print }
          ' README.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::README 更新记录里没有 ### $VERSION 段落"
            exit 1
          fi
          gh release create "$VERSION" --target "$GITHUB_SHA" --title "$VERSION" --notes-file notes.md
