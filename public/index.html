<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>库存管理</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📦</text></svg>">
<style>
  :root {
    --bg: #f5f6f8; --panel: #fff; --text: #1f2328; --muted: #6b7280; --line: #e5e7eb;
    --primary: #2563eb; --primary-weak: #eff4ff; --ok: #16a34a; --warn: #d97706; --danger: #dc2626;
    --radius: 10px; --shadow: 0 1px 2px rgba(0,0,0,.05), 0 2px 8px rgba(0,0,0,.04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115; --panel: #181b21; --text: #e6e8eb; --muted: #9aa1ab; --line: #2a2f37;
      --primary: #4f8cff; --primary-weak: #1a2640; --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
  button, input, select, textarea { font: inherit; color: inherit; }
  header { background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
  .bar { max-width: 1200px; margin: 0 auto; padding: 0 16px; display: flex; align-items: center; gap: 16px; height: 56px; }
  .brand { font-weight: 700; font-size: 16px; white-space: nowrap; }
  nav { display: flex; gap: 4px; flex: 1; overflow-x: auto; }
  nav button { background: none; border: 0; padding: 8px 12px; border-radius: 8px; cursor: pointer; color: var(--muted); white-space: nowrap; }
  nav button.active { background: var(--primary-weak); color: var(--primary); font-weight: 600; }
  main { max-width: 1200px; margin: 0 auto; padding: 16px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .stat { padding: 16px; }
  .stat .label { color: var(--muted); font-size: 13px; }
  .stat .value { font-size: 26px; font-weight: 700; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px; border-bottom: 1px solid var(--line); align-items: center; }
  .toolbar .grow { flex: 1; min-width: 160px; }
  input, select, textarea { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--primary); outline-offset: -1px; border-color: transparent; }
  .toolbar select { width: auto; }
  .btn { border: 1px solid var(--line); background: var(--panel); padding: 8px 14px; border-radius: 8px; cursor: pointer; white-space: nowrap; }
  .btn:hover { border-color: var(--muted); }
  .btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
  .btn.danger { color: var(--danger); }
  .btn.sm { padding: 4px 10px; font-size: 13px; }
  .btn.in { color: var(--ok); } .btn.out { color: var(--warn); }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { color: var(--muted); font-weight: 500; font-size: 13px; background: var(--bg); position: sticky; top: 0; }
  th.sortable { cursor: pointer; user-select: none; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  tr:last-child td { border-bottom: 0; }
  tbody tr:hover { background: var(--primary-weak); }
  .actions { display: flex; gap: 4px; justify-content: flex-end; }
  .tag { display: inline-block; padding: 1px 8px; border-radius: 99px; font-size: 12px; }
  .tag.low { background: #fdecec; color: var(--danger); }
  .tag.in { background: #e8f7ee; color: var(--ok); }
  .tag.out { background: #fdf3e6; color: var(--warn); }
  .tag.adjust { background: var(--primary-weak); color: var(--primary); }
  @media (prefers-color-scheme: dark) {
    .tag.low { background: #3a1a1a; } .tag.in { background: #14301f; } .tag.out { background: #3a2a12; }
  }
  .qty-low { color: var(--danger); font-weight: 600; }
  .muted { color: var(--muted); }
  .empty { padding: 40px; text-align: center; color: var(--muted); }
  .section-title { font-weight: 600; padding: 12px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 800px) { .grid2 { grid-template-columns: 1fr; } .hide-sm { display: none; } }
  dialog { border: 1px solid var(--line); border-radius: 12px; padding: 0; background: var(--panel); color: var(--text); width: min(520px, calc(100vw - 32px)); }
  dialog::backdrop { background: rgba(0,0,0,.4); }
  dialog form { padding: 20px; }
  dialog h3 { margin: 0 0 16px; }
  .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .fields .full { grid-column: 1 / -1; }
  label.f { display: block; font-size: 13px; color: var(--muted); }
  label.f > input, label.f > select, label.f > textarea { margin-top: 4px; color: var(--text); }
  .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg label { flex: 1; text-align: center; padding: 8px; cursor: pointer; border-right: 1px solid var(--line); }
  .seg label:last-child { border-right: 0; }
  .seg input { display: none; }
  .seg label:has(input:checked) { background: var(--primary); color: #fff; }
  .thumb { width: 44px; height: 44px; border-radius: 6px; object-fit: cover; background: var(--bg); border: 1px solid var(--line); display: block; cursor: zoom-in; }
  .thumb.none { display: grid; place-items: center; color: var(--muted); font-size: 18px; cursor: default; }
  td.img { width: 60px; padding-right: 0; }
  .imgs { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 8px; margin-top: 4px; }
  .imgs .cell { position: relative; aspect-ratio: 1; border-radius: 8px; overflow: hidden; border: 1px solid var(--line); background: var(--bg); }
  .imgs .cell img { width: 100%; height: 100%; object-fit: cover; display: block; cursor: zoom-in; }
  .imgs .cell .cover { position: absolute; left: 4px; top: 4px; background: var(--primary); color: #fff; font-size: 11px; padding: 0 6px; border-radius: 4px; }
  .imgs .cell .ops { position: absolute; inset: auto 0 0 0; display: flex; background: rgba(0,0,0,.55); }
  .imgs .cell .ops button { flex: 1; white-space: nowrap; background: none; border: 0; color: #fff; font-size: 12px; padding: 3px 0; cursor: pointer; }
  .imgs .add { display: grid; place-items: center; aspect-ratio: 1; border: 1px dashed var(--muted); border-radius: 8px; cursor: pointer; color: var(--muted); text-align: center; font-size: 12px; line-height: 1.4; }
  .imgs .add:hover { border-color: var(--primary); color: var(--primary); }
  .imgs.drag .add { border-color: var(--primary); background: var(--primary-weak); }
  #viewer { width: 100vw; height: 100vh; max-width: none; max-height: none; border: 0; border-radius: 0; background: rgba(0,0,0,.92); padding: 0; }
  #viewer img { position: absolute; inset: 0; margin: auto; max-width: calc(100% - 32px); max-height: calc(100% - 96px); object-fit: contain; }
  #viewer .vbtn { position: absolute; background: rgba(255,255,255,.15); color: #fff; border: 0; border-radius: 99px; width: 44px; height: 44px; font-size: 22px; cursor: pointer; }
  #viewer .vbtn:hover { background: rgba(255,255,255,.3); }
  #viewer .prev { left: 12px; top: 50%; transform: translateY(-50%); } #viewer .next { right: 12px; top: 50%; transform: translateY(-50%); }
  #viewer .x { right: 12px; top: 12px; }
  #viewer .cap { position: absolute; bottom: 16px; left: 0; right: 0; text-align: center; color: #ddd; }
  #toast { position: fixed; inset: auto auto 20px 50%; margin: 0; border: 0; transform: translateX(-50%); background: #111; color: #fff; padding: 10px 16px; border-radius: 8px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 100; max-width: calc(100vw - 32px); }
  #toast.show { opacity: .92; }
  #login { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
  #login .panel { padding: 28px; width: min(360px, 100%); }
  .hidden { display: none !important; }
</style>
</head>
<body>

<div id="login" class="hidden">
  <form class="panel" id="loginForm">
    <h2 style="margin-top:0">📦 库存管理</h2>
    <label class="f">访问密码<input type="password" name="password" autocomplete="current-password" required autofocus></label>
    <button class="btn primary" style="width:100%;margin-top:16px">登录</button>
  </form>
</div>

<div id="app" class="hidden">
  <header>
    <div class="bar">
      <div class="brand">📦 库存管理</div>
      <nav>
        <button data-tab="dashboard" class="active">概览</button>
        <button data-tab="items">物品</button>
        <button data-tab="movements">出入库记录</button>
        <button data-tab="data">数据</button>
      </nav>
      <button class="btn sm hidden" id="logoutBtn">退出</button>
    </div>
  </header>

  <main>
    <!-- 概览 -->
    <section data-view="dashboard">
      <div class="stats">
        <div class="panel stat"><div class="label">物品种类</div><div class="value" id="sCount">0</div></div>
        <div class="panel stat"><div class="label">库存总数量</div><div class="value" id="sQty">0</div></div>
        <div class="panel stat"><div class="label">库存总金额</div><div class="value" id="sValue">¥0</div></div>
        <div class="panel stat"><div class="label">低库存预警</div><div class="value" id="sLow" style="color:var(--danger)">0</div></div>
      </div>
      <div class="grid2">
        <div class="panel">
          <div class="section-title">⚠️ 低库存物品</div>
          <div class="table-wrap"><table><thead><tr><th>名称</th><th class="num">当前</th><th class="num">最低</th><th></th></tr></thead><tbody id="lowBody"></tbody></table></div>
        </div>
        <div class="panel">
          <div class="section-title">最近出入库 <button class="btn sm" data-goto="movements">全部</button></div>
          <div class="table-wrap"><table><thead><tr><th>时间</th><th>物品</th><th>类型</th><th class="num">数量</th></tr></thead><tbody id="recentBody"></tbody></table></div>
        </div>
      </div>
    </section>

    <!-- 物品 -->
    <section data-view="items" class="hidden">
      <div class="panel">
        <div class="toolbar">
          <input class="grow" id="q" placeholder="搜索 名称 / 编码 / 库位 / 备注…" type="search">
          <select id="catFilter"><option value="">全部分类</option></select>
          <label class="muted" style="display:flex;align-items:center;gap:4px;white-space:nowrap"><input type="checkbox" id="lowOnly" style="width:auto"> 仅低库存</label>
          <button class="btn primary" id="addBtn">+ 新增物品</button>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr>
              <th></th>
              <th class="sortable hide-sm" data-sort="sku">编码</th>
              <th class="sortable" data-sort="name">名称</th>
              <th class="sortable hide-sm" data-sort="category">分类</th>
              <th class="sortable hide-sm" data-sort="location">库位</th>
              <th class="sortable num" data-sort="qty">数量</th>
              <th class="sortable num hide-sm" data-sort="price">单价</th>
              <th class="sortable num hide-sm" data-sort="value">金额</th>
              <th></th>
            </tr></thead>
            <tbody id="itemsBody"></tbody>
          </table>
        </div>
      </div>
    </section>

    <!-- 流水 -->
    <section data-view="movements" class="hidden">
      <div class="panel">
        <div class="toolbar">
          <input class="grow" id="mq" placeholder="搜索 物品 / 备注…" type="search">
          <select id="mType"><option value="">全部类型</option><option value="in">入库</option><option value="out">出库</option><option value="adjust">盘点</option></select>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>时间</th><th>类型</th><th>物品</th><th class="num">变动</th><th class="num hide-sm">变动前</th><th class="num">变动后</th><th>备注</th></tr></thead>
            <tbody id="movBody"></tbody>
          </table>
        </div>
      </div>
    </section>

    <!-- 数据 -->
    <section data-view="data" class="hidden">
      <div class="panel" style="padding:20px;display:grid;gap:20px">
        <div>
          <h3 style="margin:0 0 8px">导出 Excel (CSV)</h3>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <a class="btn" href="/api/export/items.csv">导出物品清单</a>
            <a class="btn" href="/api/export/movements.csv">导出出入库记录</a>
          </div>
        </div>
        <div>
          <h3 style="margin:0 0 8px">备份与恢复</h3>
          <p class="muted" style="margin:0 0 8px">定期下载完整备份（JSON）。恢复会<strong>覆盖</strong>当前全部数据。</p>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <a class="btn" href="/api/backup">下载备份</a>
            <label class="btn danger">从备份恢复…<input type="file" id="restoreFile" accept=".json,application/json" hidden></label>
          </div>
        </div>
      </div>
    </section>
  </main>
</div>

<!-- 物品编辑 -->
<dialog id="itemDlg">
  <form method="dialog" id="itemForm">
    <h3 id="itemDlgTitle">新增物品</h3>
    <div class="fields">
      <label class="f full">名称 *<input name="name" required maxlength="120"></label>
      <label class="f">编码 / SKU<input name="sku" maxlength="60"></label>
      <label class="f">分类<input name="category" list="catList" maxlength="60"></label>
      <label class="f">单位<input name="unit" placeholder="件" maxlength="20" list="unitList"></label>
      <label class="f">库位<input name="location" maxlength="60"></label>
      <label class="f" id="initQtyField">初始数量<input name="qty" type="number" min="0" step="1" value="0"></label>
      <label class="f">最低库存（预警）<input name="minQty" type="number" min="0" step="1" value="0"></label>
      <label class="f">单价 (¥)<input name="price" type="number" min="0" step="0.01" value="0"></label>
      <label class="f full">备注<textarea name="note" rows="2" maxlength="500"></textarea></label>
      <div class="f full"><label class="f">产品图片 <span class="muted">（最多 10 张，第一张为封面，可拖拽或粘贴图片）</span></label>
        <div class="imgs" id="imgGrid"></div>
        <input type="file" id="imgInput" accept="image/*" multiple hidden>
      </div>
    </div>
    <div class="dialog-actions">
      <button type="button" class="btn danger hidden" id="delItemBtn" style="margin-right:auto">删除</button>
      <button type="button" class="btn" data-close>取消</button>
      <button class="btn primary">保存</button>
    </div>
  </form>
</dialog>
<datalist id="catList"></datalist>
<datalist id="unitList"><option>件</option><option>个</option><option>箱</option><option>包</option><option>套</option><option>台</option><option>米</option><option>千克</option></datalist>

<!-- 出入库 -->
<dialog id="movDlg">
  <form method="dialog" id="movForm">
    <h3 id="movTitle">出入库</h3>
    <p class="muted" id="movInfo" style="margin-top:-8px"></p>
    <div class="seg" style="margin-bottom:12px">
      <label><input type="radio" name="type" value="in" checked>入库</label>
      <label><input type="radio" name="type" value="out">出库</label>
      <label><input type="radio" name="type" value="adjust">盘点</label>
    </div>
    <div class="fields">
      <label class="f full" id="movQtyLabel">数量<input name="qty" type="number" min="0" step="1" required></label>
      <label class="f full">备注<input name="note" maxlength="200" placeholder="如：采购入库、领用人、单号…"></label>
    </div>
    <div class="dialog-actions">
      <button type="button" class="btn" data-close>取消</button>
      <button class="btn primary">确认</button>
    </div>
  </form>
</dialog>

<!-- 物品历史 -->
<dialog id="histDlg" style="width:min(720px,calc(100vw - 32px))">
  <form method="dialog">
    <h3 id="histTitle">记录</h3>
    <div class="table-wrap" style="max-height:60vh">
      <table><thead><tr><th>时间</th><th>类型</th><th class="num">变动</th><th class="num">变动后</th><th>备注</th></tr></thead><tbody id="histBody"></tbody></table>
    </div>
    <div class="dialog-actions"><button class="btn">关闭</button></div>
  </form>
</dialog>

<div id="toast" popover="manual"></div>

<!-- 图片查看 -->
<dialog id="viewer">
  <img id="vImg" alt="">
  <button class="vbtn prev" id="vPrev" aria-label="上一张">‹</button>
  <button class="vbtn next" id="vNext" aria-label="下一张">›</button>
  <button class="vbtn x" data-close aria-label="关闭">×</button>
  <div class="cap" id="vCap"></div>
</dialog>

<script>
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = (n) => '¥' + Number(n || 0).toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmtTime = (iso) => { const d = new Date(iso); const p = (n) => String(n).padStart(2, '0'); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; };
const TYPE = { in: '入库', out: '出库', adjust: '盘点' };
const isLow = (i) => i.minQty > 0 && i.qty <= i.minQty;
const imgUrl = (id, thumb) => `/api/images/${id}${thumb ? '_t' : ''}.jpg`;
const MAX_IMAGES = 10;

let items = [], movements = [], sort = { key: 'name', dir: 1 }, editing = null, moving = null;

function toast(msg) {
  const t = $('#toast'); t.textContent = msg;
  try { t.hidePopover(); t.showPopover(); } catch {} // 置于弹窗之上
  t.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2200);
}

async function api(path, opts = {}) {
  const res = await fetch(path, {
    method: opts.method || 'GET',
    headers: opts.body ? { 'Content-Type': 'application/json' } : {},
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (res.status === 401 && path !== '/api/login') { showLogin(); throw new Error(data.error || '请先登录'); }
  if (!res.ok) throw new Error(data.error || '请求失败');
  return data;
}

// ---------- 登录 ----------
function showLogin() { $('#app').classList.add('hidden'); $('#login').classList.remove('hidden'); }
$('#loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  try { await api('/api/login', { method: 'POST', body: { password: e.target.password.value } }); e.target.reset(); start(); }
  catch (err) { toast(err.message); }
});
$('#logoutBtn').onclick = async () => { await api('/api/logout', { method: 'POST' }); showLogin(); };

async function start() {
  const s = await api('/api/session');
  if (!s.authed) return showLogin();
  $('#login').classList.add('hidden'); $('#app').classList.remove('hidden');
  $('#logoutBtn').classList.toggle('hidden', !s.passwordRequired);
  await reload();
}

async function reload() {
  [items, movements] = await Promise.all([api('/api/items'), api('/api/movements?limit=2000')]);
  render();
}

// ---------- 导航 ----------
function go(tab) {
  $$('nav button').forEach((b) => b.classList.toggle('active', b.dataset.tab === tab));
  $$('[data-view]').forEach((v) => v.classList.toggle('hidden', v.dataset.view !== tab));
  history.replaceState(null, '', '#' + tab);
}
$$('nav button').forEach((b) => (b.onclick = () => go(b.dataset.tab)));
$$('[data-goto]').forEach((b) => (b.onclick = () => go(b.dataset.goto)));
if (location.hash) go(location.hash.slice(1));

// ---------- 渲染 ----------
function render() { renderDashboard(); renderItems(); renderMovements(); renderCategories(); }

function renderDashboard() {
  $('#sCount').textContent = items.length;
  $('#sQty').textContent = items.reduce((a, i) => a + i.qty, 0).toLocaleString();
  $('#sValue').textContent = money(items.reduce((a, i) => a + i.qty * i.price, 0));
  const low = items.filter(isLow).sort((a, b) => a.qty - b.qty);
  $('#sLow').textContent = low.length;
  $('#lowBody').innerHTML = low.length ? low.slice(0, 10).map((i) => `
    <tr><td>${esc(i.name)}</td><td class="num qty-low">${i.qty}</td><td class="num">${i.minQty}</td>
    <td class="actions"><button class="btn sm in" data-mv="${i.id}" data-t="in">入库</button></td></tr>`).join('')
    : '<tr><td colspan="4" class="empty">暂无低库存物品 👍</td></tr>';
  $('#recentBody').innerHTML = movements.length ? movements.slice(0, 10).map((m) => `
    <tr><td class="muted">${fmtTime(m.at)}</td><td>${esc(m.itemName)}</td><td><span class="tag ${m.type}">${TYPE[m.type]}</span></td>
    <td class="num">${m.qty > 0 && m.type !== 'out' ? '+' : m.type === 'out' ? '-' : ''}${m.qty}</td></tr>`).join('')
    : '<tr><td colspan="4" class="empty">暂无记录</td></tr>';
}

function renderCategories() {
  const cats = [...new Set(items.map((i) => i.category).filter(Boolean))].sort();
  const cur = $('#catFilter').value;
  $('#catFilter').innerHTML = '<option value="">全部分类</option>' + cats.map((c) => `<option ${c === cur ? 'selected' : ''}>${esc(c)}</option>`).join('');
  $('#catList').innerHTML = cats.map((c) => `<option value="${esc(c)}">`).join('');
}

function renderItems() {
  const q = $('#q').value.trim().toLowerCase();
  const cat = $('#catFilter').value;
  const lowOnly = $('#lowOnly').checked;
  const val = (i, k) => (k === 'value' ? i.qty * i.price : i[k]);
  const list = items
    .filter((i) => (!cat || i.category === cat) && (!lowOnly || isLow(i)) &&
      (!q || [i.name, i.sku, i.location, i.note, i.category].some((f) => String(f || '').toLowerCase().includes(q))))
    .sort((a, b) => {
      const x = val(a, sort.key), y = val(b, sort.key);
      return (typeof x === 'number' ? x - y : String(x).localeCompare(String(y), 'zh-CN')) * sort.dir;
    });
  $$('th[data-sort]').forEach((th) => {
    th.textContent = th.textContent.replace(/ [▲▼]$/, '') + (th.dataset.sort === sort.key ? (sort.dir > 0 ? ' ▲' : ' ▼') : '');
  });
  $('#itemsBody').innerHTML = list.length ? list.map((i) => `
    <tr>
      <td class="img">${i.images?.length ? `<img class="thumb" loading="lazy" src="${imgUrl(i.images[0], true)}" data-gallery="${i.id}" alt="">` : '<div class="thumb none">📷</div>'}</td>
      <td class="muted hide-sm">${esc(i.sku) || '—'}</td>
      <td><a href="#" data-hist="${i.id}" style="color:inherit">${esc(i.name)}</a> ${isLow(i) ? '<span class="tag low">低库存</span>' : ''}</td>
      <td class="hide-sm">${esc(i.category) || '<span class="muted">—</span>'}</td>
      <td class="hide-sm">${esc(i.location) || '<span class="muted">—</span>'}</td>
      <td class="num ${isLow(i) ? 'qty-low' : ''}">${i.qty} <span class="muted">${esc(i.unit)}</span></td>
      <td class="num hide-sm">${money(i.price)}</td>
      <td class="num hide-sm">${money(i.qty * i.price)}</td>
      <td class="actions">
        <button class="btn sm in" data-mv="${i.id}" data-t="in">入库</button>
        <button class="btn sm out" data-mv="${i.id}" data-t="out">出库</button>
        <button class="btn sm" data-edit="${i.id}">编辑</button>
      </td>
    </tr>`).join('')
    : `<tr><td colspan="9" class="empty">${items.length ? '没有匹配的物品' : '还没有物品，点击右上角「新增物品」开始吧'}</td></tr>`;
}

function renderMovements() {
  const q = $('#mq').value.trim().toLowerCase();
  const t = $('#mType').value;
  const list = movements.filter((m) => (!t || m.type === t) && (!q || [m.itemName, m.sku, m.note].some((f) => String(f || '').toLowerCase().includes(q))));
  $('#movBody').innerHTML = list.length ? list.map(movRow).join('') : '<tr><td colspan="7" class="empty">暂无记录</td></tr>';
}
function movRow(m, withItem = true) {
  const sign = m.type === 'out' ? '-' : m.qty > 0 ? '+' : '';
  return `<tr><td class="muted">${fmtTime(m.at)}</td><td><span class="tag ${m.type}">${TYPE[m.type]}</span></td>
    ${withItem ? `<td>${esc(m.itemName)}${m.sku ? ` <span class="muted">${esc(m.sku)}</span>` : ''}</td>` : ''}
    <td class="num">${sign}${m.qty}</td>${withItem ? `<td class="num hide-sm">${m.before}</td>` : ''}<td class="num">${m.after}</td><td>${esc(m.note)}</td></tr>`;
}

['#q', '#catFilter', '#lowOnly'].forEach((s) => $(s).addEventListener('input', renderItems));
['#mq', '#mType'].forEach((s) => $(s).addEventListener('input', renderMovements));
$$('th[data-sort]').forEach((th) => (th.onclick = () => {
  sort = { key: th.dataset.sort, dir: sort.key === th.dataset.sort ? -sort.dir : 1 };
  renderItems();
}));

// ---------- 事件委托 ----------
document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-mv],[data-edit],[data-hist],[data-close],img[data-gallery]');
  if (!t) return;
  if (t.dataset.close !== undefined) return t.closest('dialog').close();
  e.preventDefault();
  if (t.dataset.mv) openMove(Number(t.dataset.mv), t.dataset.t);
  if (t.dataset.edit) openItem(items.find((i) => i.id === Number(t.dataset.edit)));
  if (t.dataset.hist) openHistory(Number(t.dataset.hist));
  if (t.dataset.gallery) { const it = items.find((i) => i.id === Number(t.dataset.gallery)); openViewer(it.images.map((id) => imgUrl(id)), 0, it.name); }
});

// ---------- 物品编辑 ----------
$('#addBtn').onclick = () => openItem(null);
function openItem(item) {
  editing = item;
  const f = $('#itemForm');
  f.reset();
  $('#itemDlgTitle').textContent = item ? '编辑物品' : '新增物品';
  $('#initQtyField').classList.toggle('hidden', !!item);
  $('#delItemBtn').classList.toggle('hidden', !item);
  if (item) ['name', 'sku', 'category', 'unit', 'location', 'minQty', 'price', 'note'].forEach((k) => (f[k].value = item[k] ?? ''));
  // 图片在对话框内先暂存，点「保存」时才真正上传 / 删除
  imgs = (item?.images || []).map((id) => ({ id, src: imgUrl(id, true), full: imgUrl(id) }));
  renderImgs();
  $('#itemDlg').showModal();
}
$('#itemForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const body = Object.fromEntries(new FormData(e.target));
  const btn = e.submitter || $('#itemForm button.primary');
  btn.disabled = true;
  try {
    const item = editing
      ? await api('/api/items/' + editing.id, { method: 'PUT', body })
      : await api('/api/items', { method: 'POST', body });
    editing = item; // 新建后若图片上传失败，再次保存不会重复创建
    const pending = imgs.filter((x) => !x.id);
    for (let n = 0; n < pending.length; n++) {
      btn.textContent = `上传图片 ${n + 1}/${pending.length}…`;
      const r = await api(`/api/items/${item.id}/images`, { method: 'POST', body: { full: pending[n].data, thumb: pending[n].thumb } });
      pending[n].id = r.id;
    }
    const order = imgs.map((x) => x.id);
    if (order.join() !== (item.images || []).join() || pending.length) {
      await api(`/api/items/${item.id}/images`, { method: 'PUT', body: { images: order } });
    }
    $('#itemDlg').close(); toast('已保存'); await reload();
  } catch (err) { toast(err.message); }
  finally { btn.disabled = false; btn.textContent = '保存'; }
});

// ---------- 图片编辑 ----------
let imgs = [];
function renderImgs() {
  $('#imgGrid').innerHTML = imgs.map((x, n) => `
    <div class="cell">
      <img src="${x.src}" data-idx="${n}" alt="">
      ${n === 0 ? '<span class="cover">封面</span>' : ''}
      <div class="ops">
        ${n > 0 ? `<button type="button" data-cover="${n}">设封面</button>` : ''}
        <button type="button" data-rm="${n}">删除</button>
      </div>
    </div>`).join('') +
    (imgs.length < MAX_IMAGES ? '<div class="add" id="imgAdd" role="button" tabindex="0">＋<br>添加图片</div>' : '');
}
$('#imgGrid').addEventListener('click', (e) => {
  const t = e.target;
  if (t.closest('#imgAdd')) return $('#imgInput').click();
  if (t.dataset.rm) { imgs.splice(Number(t.dataset.rm), 1); return renderImgs(); }
  if (t.dataset.cover) { imgs.unshift(...imgs.splice(Number(t.dataset.cover), 1)); return renderImgs(); }
  if (t.dataset.idx) openViewer(imgs.map((x) => x.full), Number(t.dataset.idx), $('#itemForm').name.value);
});
$('#imgGrid').addEventListener('keydown', (e) => { if (e.target.id === 'imgAdd' && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); $('#imgInput').click(); } });
$('#imgInput').addEventListener('change', (e) => { addImageFiles(e.target.files); e.target.value = ''; });
$('#imgGrid').addEventListener('dragover', (e) => { e.preventDefault(); $('#imgGrid').classList.add('drag'); });
$('#imgGrid').addEventListener('dragleave', () => $('#imgGrid').classList.remove('drag'));
$('#imgGrid').addEventListener('drop', (e) => { e.preventDefault(); $('#imgGrid').classList.remove('drag'); addImageFiles(e.dataTransfer.files); });
$('#itemDlg').addEventListener('paste', (e) => {
  const files = [...e.clipboardData.files].filter((f) => f.type.startsWith('image/'));
  if (files.length) { e.preventDefault(); addImageFiles(files); }
});

async function addImageFiles(fileList) {
  const files = [...fileList].filter((f) => f.type.startsWith('image/') || /\.(heic|heif)$/i.test(f.name));
  const room = MAX_IMAGES - imgs.length;
  if (files.length > room) toast(`每个物品最多 ${MAX_IMAGES} 张图片，已忽略多余的 ${files.length - room} 张`);
  for (const f of files.slice(0, Math.max(room, 0))) {
    try {
      const data = await compressImage(f, 1600, 0.85);
      const thumb = await compressImage(f, 240, 0.8);
      imgs.push({ id: null, src: thumb, full: data, data, thumb });
      renderImgs();
    } catch { toast(`无法读取图片「${f.name}」，请换成 JPG / PNG 格式`); }
  }
}

// 在浏览器里缩放并压缩成 JPEG，手机拍的大图也只有几百 KB
function compressImage(file, maxSize, quality) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      const scale = Math.min(1, maxSize / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(img.naturalWidth * scale));
      c.height = Math.max(1, Math.round(img.naturalHeight * scale));
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#fff'; // 透明背景填白
      ctx.fillRect(0, 0, c.width, c.height);
      ctx.drawImage(img, 0, 0, c.width, c.height);
      resolve(c.toDataURL('image/jpeg', quality));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('decode')); };
    img.src = url;
  });
}

// ---------- 图片查看 ----------
let viewer = { list: [], i: 0, title: '' };
function openViewer(list, i, title) {
  viewer = { list, i, title };
  showViewer();
  if (!$('#viewer').open) $('#viewer').showModal();
}
function showViewer() {
  const { list, i, title } = viewer;
  $('#vImg').src = list[i];
  $('#vCap').textContent = `${title || ''}  ${i + 1} / ${list.length}`;
  $('#vPrev').classList.toggle('hidden', list.length < 2);
  $('#vNext').classList.toggle('hidden', list.length < 2);
}
const step = (d) => { viewer.i = (viewer.i + d + viewer.list.length) % viewer.list.length; showViewer(); };
$('#vPrev').onclick = () => step(-1);
$('#vNext').onclick = () => step(1);
$('#viewer').addEventListener('click', (e) => { if (e.target.id === 'viewer') $('#viewer').close(); });
$('#viewer').addEventListener('keydown', (e) => { if (e.key === 'ArrowLeft') step(-1); if (e.key === 'ArrowRight') step(1); });
let touchX = null;
$('#viewer').addEventListener('touchstart', (e) => (touchX = e.touches[0].clientX), { passive: true });
$('#viewer').addEventListener('touchend', (e) => { if (touchX === null) return; const dx = e.changedTouches[0].clientX - touchX; if (Math.abs(dx) > 40) step(dx < 0 ? 1 : -1); touchX = null; });
$('#delItemBtn').onclick = async () => {
  if (!editing || !confirm(`确定删除「${editing.name}」？出入库记录会保留。`)) return;
  try { await api('/api/items/' + editing.id, { method: 'DELETE' }); $('#itemDlg').close(); toast('已删除'); await reload(); }
  catch (err) { toast(err.message); }
};

// ---------- 出入库 ----------
function openMove(id, type) {
  moving = items.find((i) => i.id === id);
  const f = $('#movForm');
  f.reset();
  f.type.value = type || 'in';
  $('#movTitle').textContent = moving.name;
  $('#movInfo').textContent = `当前库存：${moving.qty} ${moving.unit}`;
  updateMoveLabel();
  $('#movDlg').showModal();
  f.qty.focus();
}
function updateMoveLabel() {
  const t = $('#movForm').type.value;
  $('#movQtyLabel').firstChild.textContent = t === 'adjust' ? '盘点后实际数量' : t === 'in' ? '入库数量' : '出库数量';
}
$$('#movForm input[name=type]').forEach((r) => r.addEventListener('change', updateMoveLabel));
$('#movForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const body = Object.fromEntries(new FormData(e.target));
  try {
    await api('/api/movements', { method: 'POST', body: { ...body, itemId: moving.id } });
    $('#movDlg').close(); toast(TYPE[body.type] + '成功'); await reload();
  } catch (err) { toast(err.message); }
});

// ---------- 物品历史 ----------
async function openHistory(id) {
  const item = items.find((i) => i.id === id);
  $('#histTitle').textContent = `${item.name} · 当前 ${item.qty} ${item.unit}`;
  const list = await api('/api/movements?itemId=' + id + '&limit=5000');
  $('#histBody').innerHTML = list.length ? list.map((m) => movRow(m, false)).join('') : '<tr><td colspan="5" class="empty">暂无记录</td></tr>';
  $('#histDlg').showModal();
}

// ---------- 恢复备份 ----------
$('#restoreFile').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file || !confirm('恢复备份将覆盖当前所有数据，确定继续？')) return;
  try {
    const r = await api('/api/backup', { method: 'POST', body: JSON.parse(await file.text()) });
    toast(`已恢复：${r.items} 个物品，${r.movements} 条记录`); await reload();
  } catch (err) { toast('恢复失败：' + err.message); }
});

start().catch((e) => toast(e.message));
</script>
